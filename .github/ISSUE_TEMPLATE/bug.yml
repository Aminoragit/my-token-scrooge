name: Bug report
description: Report a reproducible defect
body:
  - type: input
    id: version
    attributes:
      label: MTS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

